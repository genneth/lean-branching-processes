name = "lean-branching-processes"
version = "0.1.0"
keywords = ["math", "probability", "branching-processes"]
defaultTargets = ["LeanBranchingProcesses"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

[[lean_lib]]
name = "LeanBranchingProcesses"
